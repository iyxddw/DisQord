services:
  qq-node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.qq
    restart: unless-stopped
    environment:
      CENTRAL_WSS_URL: ${CENTRAL_WSS_URL:?set CENTRAL_WSS_URL}
      NODE_PAIRING_CODE: ${NODE_PAIRING_CODE:-}
      NAPCAT_ONEBOT_WS_URL: ${NAPCAT_ONEBOT_WS_URL:-ws://host.docker.internal:3001}
      NAPCAT_ACCESS_TOKEN: ${NAPCAT_ACCESS_TOKEN:?set NAPCAT_ACCESS_TOKEN}
      NODE_CONFIG_PATH: /data/qq-node.json
      NODE_QUEUE_PATH: /data/qq-queue.sqlite
      NODE_WEB_HOST: 0.0.0.0
      NODE_WEB_PORT: 8090
      NODE_WEB_TOKEN: ${NODE_WEB_TOKEN:?set NODE_WEB_TOKEN}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - disqord-qq-data:/data

volumes:
  disqord-qq-data:
