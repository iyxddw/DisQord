services:
  discord-node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.discord
    restart: unless-stopped
    environment:
      CENTRAL_WSS_URL: ${CENTRAL_WSS_URL:?set CENTRAL_WSS_URL}
      NODE_PAIRING_CODE: ${NODE_PAIRING_CODE:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      NODE_CONFIG_PATH: /data/discord-node.json
      NODE_QUEUE_PATH: /data/discord-queue.sqlite
      NODE_WEB_HOST: 0.0.0.0
      NODE_WEB_PORT: 8090
      NODE_WEB_TOKEN: ${NODE_WEB_TOKEN:?set NODE_WEB_TOKEN}
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - disqord-discord-data:/data

volumes:
  disqord-discord-data:
